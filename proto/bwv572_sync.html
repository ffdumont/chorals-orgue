<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>BWV 572 — Partition synchronisee (prototype)</title>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.7/build/opensheetmusicdisplay.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1600px; margin: 1.5em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.3em; margin: 0 0 0.3em 0; }
  p.note { margin: 0.2em 0 1em 0; }

  /* Video on top (responsive 16:9), score below with horizontal scroll.
     OSMD is set to pageFormat "Endless" so the whole piece renders as a
     single long horizontal staff that scrolls left-to-right. */
  .video-wrap { position: relative; width: 100%; max-width: 720px; aspect-ratio: 16 / 9; margin: 0 auto; }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .score-wrap { margin-top: 1em; border: 1px solid #ddd; background: #fafafa; height: 62vh; min-height: 340px; overflow-x: auto; overflow-y: auto; }
  #osmd { height: 100%; }

  #controls { margin: 1em 0; font-size: 14px; color: #555; display: flex; gap: 1.5em; align-items: center; flex-wrap: wrap; }
  #controls label { display: flex; gap: 0.3em; align-items: center; }
  #controls input { width: 70px; }
  #status { font-family: monospace; color: #888; }
  .note { color: #0a6; }
  .warn { color: #c60; }
</style>
</head>
<body>
<h1>BWV 572 — Prototype : partition synchronisee avec la video</h1>
<p class="note">Lance la lecture de la video pour voir le curseur avancer dans la partition. Ajuste l'<em>offset</em> si la synchro derive.</p>

<div class="video-wrap">
  <iframe id="player"
          src="https://www.youtube.com/embed/gKU9n1Uh6xI?enablejsapi=1"
          title="BWV 572 Gravement (SJdL)"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
</div>

<div class="score-wrap">
  <div id="osmd"></div>
</div>

<div id="controls">
  <label>Offset (s): <input type="number" id="offset" value="0" step="0.1" /></label>
  <label><input type="checkbox" id="show-cursor" checked /> Curseur visible</label>
  <span id="status">Chargement...</span>
</div>

<script>
(function () {
  "use strict";

  const statusEl = document.getElementById("status");
  const offsetEl = document.getElementById("offset");
  const showCursorEl = document.getElementById("show-cursor");

  // --- OSMD ------------------------------------------------------------
  // pageFormat "Endless" = render everything on one continuous horizontal
  // staff (no line breaks), so the score scrolls left-to-right instead of
  // wrapping onto multiple systems. autoResize:false because the "Endless"
  // width is intrinsic to the music, not the container.
  const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd", {
    autoResize: false,
    drawTitle: false,
    drawSubtitle: false,
    drawComposer: false,
    followCursor: true,
    pageFormat: "Endless",
    drawingParameters: "compact",
  });

  let timemap = null;     // [t0, t1, ...] unique onset times in seconds
  let cursorStep = 0;     // current index in timemap (== cursor.next() count applied)
  let scoreReady = false;

  async function loadScoreAndMap() {
    try {
      const [xmlResp, mapResp] = await Promise.all([
        fetch("bwv572_gravement.musicxml"),
        fetch("timemap.json"),
      ]);
      if (!xmlResp.ok) throw new Error("MusicXML HTTP " + xmlResp.status);
      if (!mapResp.ok) throw new Error("timemap HTTP " + mapResp.status);
      const xml = await xmlResp.text();
      const map = await mapResp.json();
      timemap = map.onsets;
      await osmd.load(xml);
      await osmd.render();
      osmd.cursor.show();
      scoreReady = true;
      statusEl.textContent = "Partition OK (" + timemap.length + " onsets MIDI).";
    } catch (err) {
      statusEl.textContent = "Erreur chargement: " + err.message;
      statusEl.className = "warn";
      console.error(err);
    }
  }

  showCursorEl.addEventListener("change", () => {
    if (!scoreReady) return;
    if (showCursorEl.checked) osmd.cursor.show(); else osmd.cursor.hide();
  });

  // --- YouTube iframe API ---------------------------------------------
  let ytPlayer = null;
  let syncRunning = false;

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player("player", {
      events: {
        onReady: () => {
          statusEl.textContent += " | Video prete.";
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING && !syncRunning) {
            syncRunning = true;
            requestAnimationFrame(syncLoop);
          }
        },
      },
    });
  };

  (function injectYTApi() {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  })();

  // --- Sync loop -------------------------------------------------------
  function resetCursorTo(t) {
    osmd.cursor.reset();
    cursorStep = 0;
    while (cursorStep < timemap.length && timemap[cursorStep] <= t) {
      osmd.cursor.next();
      cursorStep++;
    }
  }

  function syncLoop() {
    if (!scoreReady || !ytPlayer || typeof ytPlayer.getCurrentTime !== "function") {
      return requestAnimationFrame(syncLoop);
    }
    const offset = parseFloat(offsetEl.value) || 0;
    const t = ytPlayer.getCurrentTime() - offset;

    // Scrub backward -> rewind cursor from scratch (OSMD has no previous-by-time API)
    if (cursorStep > 0 && timemap[cursorStep - 1] > t + 0.25) {
      resetCursorTo(t);
    } else {
      while (cursorStep < timemap.length && timemap[cursorStep] <= t) {
        osmd.cursor.next();
        cursorStep++;
      }
    }

    requestAnimationFrame(syncLoop);
  }

  loadScoreAndMap();
})();
</script>
</body>
</html>
